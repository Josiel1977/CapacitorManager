name: Verificar integração da auditoria
on:
  push:
    branches: [feat/estudo-demanda-contratada]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-test-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx eslint lib/report-professional.ts lib/consultancy-pdf.ts lib/energy-diagnosis-pdf.ts components/ReportProfessionalForm.tsx components/ReportPrintView.tsx tests/report-professional.test.ts lib/audit-study-import.ts lib/energy-diagnosis-report.ts components/TariffConsultancy.tsx components/ExpansionPlanner.tsx components/EnergyTariffDiagnosis.tsx app/auditoria/page.tsx tests/audit-study-import.test.ts
      - run: npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --experimental-strip-types scripts/test-report-print.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-impressao-relatorios
          path: artifacts/report-print/
          retention-days: 7
